import org.gradle.internal.os.OperatingSystem

ext {
    jlinkModulesCommon = [
        'java.se',
        'jdk.unsupported',
        'jdk.crypto.ec',
        'jdk.crypto.cryptoki',
        'jdk.zipfs',
        'jdk.charsets',
        'jdk.localedata',
        'jdk.management',
        'jdk.management.agent',
        'jdk.jfr',
        'jdk.management.jfr',
        'jdk.naming.dns',
        'jdk.naming.rmi',
        'jdk.httpserver',
        'jdk.xml.dom',
        'jdk.net',
        'jdk.nio.mapmode',
        'jdk.security.auth',
        'jdk.security.jgss',
        'jdk.compiler',
        'jdk.dynalink'
    ]
    jlinkModulesWin = jlinkModulesCommon + ['jdk.crypto.mscapi']
    jlinkModulesMac = jlinkModulesCommon
}

def hostJavaHome = javaToolchains.launcherFor(java.toolchain).get().metadata.installationPath.asFile
def isWindowsHost = OperatingSystem.current().isWindows()
def isMacHost = OperatingSystem.current().isMacOsX()
def jlinkExecutable = new File(hostJavaHome, isWindowsHost ? 'bin/jlink.exe' : 'bin/jlink').absolutePath
def jpackageExecutable = new File(hostJavaHome, isWindowsHost ? 'bin/jpackage.exe' : 'bin/jpackage').absolutePath

// The bundles run without a console window: the Gateway shows a tray / menu-bar icon to open or stop it, and a second
// start opens the running Gateway (application.gateway.desktop).
def desktopJavaOptions = ['-Xmx2g', '-Dapplication.gateway.desktop=true']

def macLauncherCommandContent = { String jarFileName ->
    """#!/bin/bash
DIR="\$( cd "\$( dirname "\${BASH_SOURCE[0]}" )" && pwd )"
cd "\$DIR"

# Remove macOS Gatekeeper quarantine attribute from bundled runtime if present
xattr -cr "\$DIR/runtime" 2>/dev/null || true
chmod +x "\$DIR/runtime/bin/java" "\$DIR/runtime/lib/jspawnhelper" 2>/dev/null || true

# nohup: closing this Terminal window does not stop Assimbly; its menu-bar icon does
nohup "\$DIR/runtime/bin/java" ${desktopJavaOptions.join(' ')} -Dapple.awt.UIElement=true -jar "\$DIR/app/${jarFileName}" "\$@" >/dev/null 2>&1 &

echo "Assimbly Gateway ${project.version} is starting."
echo "Your browser opens once it is ready. To stop Assimbly, use its icon in the menu bar."
echo "You can close this window."
"""
}

def bundleReadmeContent = { String startStep ->
    """Assimbly Gateway ${project.version} - Quick Start
==================================================

1. Start Assimbly: ${startStep}

2. A message "Assimbly is starting" appears in the corner of your
   screen, and the Assimbly icon appears in the taskbar tray (Windows)
   or the menu bar (Mac). Starting takes about 10 seconds.
   Then the message "Assimbly is running" appears and your browser
   opens Assimbly.

   If Assimbly cannot start, a window tells you which log file
   explains why, with a button that opens it.

3. Sign in with:
   Username: admin
   Password: admin
   Right after, choose your own password of at least 12 characters
   (any characters; no capitals, digits or symbols needed).

4. Click "Tutorials" in the top bar and choose "Quick start" to run
   your first Flow in 5 minutes!

Using Assimbly:
   Closed the browser? Start Assimbly again, or click its icon
   and choose "Open Assimbly".
   To stop Assimbly, click its icon and choose "Stop Assimbly".
   Something wrong? Choose "Open logs folder" on the icon.

Documentation:
   https://github.com/assimbly/gateway/wiki/quick-start
"""
}

// ---------------------------------------------------------------------------
// Target Runtime Download (for building the Mac bundle on another OS)
// ---------------------------------------------------------------------------

def jdksDir = layout.buildDirectory.dir("jdks")

tasks.register('downloadRuntimeMacArm64', Download) {
    description = 'Downloads Adoptium JRE 25 for macOS Apple Silicon (aarch64).'
    group = 'distribution'
    src 'https://api.adoptium.net/v3/binary/latest/25/ga/mac/aarch64/jre/hotspot/normal/eclipse'
    dest jdksDir.map { it.file('jre25-mac-aarch64.tar.gz') }
    overwrite false
    onlyIf { !isMacHost && !dest.exists() }
}

tasks.register('extractRuntimeMacArm64', Copy) {
    dependsOn 'downloadRuntimeMacArm64'
    from({ tarTree(resources.gzip(jdksDir.get().file('jre25-mac-aarch64.tar.gz'))) })
    into jdksDir.map { it.dir('mac-aarch64') }
    onlyIf { !isMacHost && !jdksDir.get().dir('mac-aarch64').asFile.exists() }
}

def findJavaRuntimeHome = { File searchRoot ->
    File found = null
    searchRoot.eachDirRecurse { dir ->
        if (dir.name == 'bin' && (new File(dir, 'java').exists() || new File(dir, 'java.exe').exists())) {
            found = dir.parentFile
        }
    }
    if (found == null) {
        throw new GradleException("Could not find Java runtime home directory under ${searchRoot}")
    }
    return found
}

// ---------------------------------------------------------------------------
// Windows Packaging (jpackage Assimbly.exe + portable ZIP)
// ---------------------------------------------------------------------------

tasks.register('preparePackageWin') {
    description = 'Builds the self-contained Windows application image with embedded Java 25 runtime.'
    group = 'distribution'
    dependsOn tasks.named('bootJar')

    doFirst {
        // Only jpackage on Windows makes Assimbly.exe, the one way to start the Windows bundle
        if (!isWindowsHost) {
            throw new GradleException('The Windows bundle (Assimbly.exe) can only be built on Windows')
        }
    }

    doLast {
        def bootJarFile = tasks.named('bootJar').get().archiveFile.get().asFile
        def workDir = layout.buildDirectory.dir('package/win').get().asFile
        def appImageDir = new File(workDir, 'Assimbly')
        delete(workDir)
        workDir.mkdirs()

        def inputDir = new File(workDir, 'input')
        inputDir.mkdirs()
        copy {
            from bootJarFile
            into inputDir
            rename { 'gateway.jar' }
        }

        def iconFile = file('src/main/webapp/favicon.ico')
        def jpackageCmd = [
            jpackageExecutable,
            '--type', 'app-image',
            '--name', 'Assimbly',
            '--input', inputDir.absolutePath,
            '--main-jar', 'gateway.jar',
            '--main-class', 'org.springframework.boot.loader.launch.JarLauncher',
            '--dest', workDir.absolutePath,
            '--app-version', project.version.toString().replaceAll('-.*', ''),
            '--vendor', 'Assimbly',
            '--description', 'Assimbly Gateway',
            '--java-options', desktopJavaOptions[0],
            '--java-options', desktopJavaOptions[1],
            '--add-modules', jlinkModulesWin.join(','),
            '--jlink-options', '--strip-debug --no-man-pages --no-header-files --compress=zip-6'
        ]
        if (iconFile.exists() && iconFile.length() > 0) {
            jpackageCmd.addAll(['--icon', iconFile.absolutePath])
        }

        def proc = new ProcessBuilder(jpackageCmd).inheritIO().start()
        int exitCode = proc.waitFor()
        if (exitCode != 0) {
            throw new GradleException("jpackage failed with exit code ${exitCode}")
        }
        delete(inputDir)

        new File(appImageDir, 'README.txt').setText(bundleReadmeContent('Double-click "Assimbly" (Assimbly.exe)').replace('\n', '\r\n'), 'UTF-8')
    }
}

tasks.register('packageWin', Zip) {
    description = 'Packages the self-contained Windows bundle (with embedded Java 25) into a ZIP archive.'
    group = 'distribution'
    dependsOn 'preparePackageWin'
    archiveFileName = "assimbly-gateway-${project.version}-windows-x64.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(layout.buildDirectory.dir('package/win'))
}

// ---------------------------------------------------------------------------
// macOS Packaging (jlink / embedded Java 25 + Start Assimbly.command + .tar.gz)
// ---------------------------------------------------------------------------

tasks.register('preparePackageMac') {
    description = 'Builds the self-contained macOS (Apple Silicon) bundle with embedded Java 25 runtime.'
    group = 'distribution'
    dependsOn tasks.named('bootJar'), tasks.named('extractRuntimeMacArm64')

    doLast {
        def bootJarFile = tasks.named('bootJar').get().archiveFile.get().asFile
        def workDir = layout.buildDirectory.dir('package/mac').get().asFile
        def appImageDir = new File(workDir, 'Assimbly')
        delete(workDir)
        def appDir = new File(appImageDir, 'app')
        appDir.mkdirs()

        copy {
            from bootJarFile
            into appDir
            rename { 'gateway.jar' }
        }

        def runtimeDir = new File(appImageDir, 'runtime')
        if (isMacHost) {
            def jlinkCmd = [
                jlinkExecutable,
                '--add-modules', jlinkModulesMac.join(','),
                '--strip-debug',
                '--no-man-pages',
                '--no-header-files',
                '--compress=zip-6',
                '--output', runtimeDir.absolutePath
            ]
            def proc = new ProcessBuilder(jlinkCmd).inheritIO().start()
            int exitCode = proc.waitFor()
            if (exitCode != 0) {
                throw new GradleException("jlink for macOS failed with exit code ${exitCode}")
            }
        } else {
            def macRuntimeHome = findJavaRuntimeHome(jdksDir.get().dir('mac-aarch64').asFile)
            copy {
                from macRuntimeHome
                into runtimeDir
                exclude 'man/**', 'legal/**'
            }
        }

        new File(appImageDir, 'Start Assimbly.command').setText(macLauncherCommandContent('gateway.jar'), 'UTF-8')
        new File(appImageDir, 'README.txt').setText(bundleReadmeContent('''Double-click "Start Assimbly.command"
   (If macOS says the file is from an unidentified developer,
   right-click "Start Assimbly.command" and click "Open".)'''), 'UTF-8')
    }
}

tasks.register('packageMac', Tar) {
    description = 'Packages the self-contained macOS bundle (with embedded Java 25) into a .tar.gz archive.'
    group = 'distribution'
    dependsOn 'preparePackageMac'
    archiveFileName = "assimbly-gateway-${project.version}-mac-aarch64.tar.gz"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    compression = Compression.GZIP

    from(layout.buildDirectory.dir('package/mac')) {
        exclude '**/Start Assimbly.command'
        exclude '**/runtime/bin/**'
        exclude '**/runtime/lib/jspawnhelper'
    }
    from(layout.buildDirectory.dir('package/mac')) {
        include '**/Start Assimbly.command'
        include '**/runtime/bin/**'
        include '**/runtime/lib/jspawnhelper'
        filePermissions {
            unix(0755)
        }
    }
}

tasks.register('packageAll') {
    description = 'Packages both Windows and macOS self-contained bundles in build/distributions.'
    group = 'distribution'
    dependsOn 'packageWin', 'packageMac'
}
