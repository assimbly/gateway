jib {
    from {
        image = "eclipse-temurin:25-jre-noble"
    }
    to {
        image = "gateway:latest"
    }
    container {
        entrypoint = ["bash", "-c", "/entrypoint.sh"]
        ports = ["8088"]
        environment = [
            SPRING_OUTPUT_ANSI_ENABLED: "ALWAYS",
            JHIPSTER_SLEEP: "0"
        ]
        creationTime = "USE_CURRENT_TIMESTAMP"
        user = 1000
    }
    extraDirectories {
      paths = file("src/main/docker/jib")
      permissions = [
        "/entrypoint.sh": "755",
        "/migrate_jks_to_pkcs12.sh": "755"
      ]
    }
}

dependencies {
    runtimeOnly "org.springframework:spring-aspects:7.0.5"
}

