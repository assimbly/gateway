def appVersion = project.version
def profiles = "headless"
profiles += ",no-liquibase"
profiles += ",api-docs"

springBoot {
    buildInfo()
}

bootRun {
    args = []
}

task webapp_test(type: NpmTask, dependsOn: "npm_install") {
    args = ["run", "webapp:test"]
}

task webapp(type: NpmTask, dependsOn: "npm_install") {
    args = project.type.equalsIgnoreCase("headless") ? ["run", "webapp:headless"] : ["run", "webapp:prod"]
}

processResources {
    inputs.property('version', version)
    inputs.property('type', project.type)
    inputs.property('springProfiles', profiles)
    filesMatching("**/application.yml") {
        filter {
            it.replace("#project.version#", appVersion)
        }
        filter {
            it.replace("#spring.profiles.active#", profiles)
        }
    }
}

test.dependsOn webapp_test
processResources.dependsOn webapp
bootJar.dependsOn processResources

dependencies {
    runtimeOnly "org.springframework:spring-aspects:7.0.5"
}
