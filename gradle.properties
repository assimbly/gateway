## below are some of the gradle performance improvement settings that can be used as required, these are not enabled by default=
## Assimbly needs JDK21 (Gradle uses the JAVA_HOME by default)=
## If JAVA_HOME is not set or set to another version, uncomment the value below=
# org.gradle.java.home=D:/test/JDKS3/graalvm-jdk-21.0.4+8.1
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.port=1099 -Dcom.sun.management.jmxremote.rmi.port=1099 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false
