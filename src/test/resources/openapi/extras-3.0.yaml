openapi: 3.0.3
info:
  title: Billing
  version: '3'
  contact:
    name: Billing team
  x-audience: internal
servers:
  - url: https://billing.example.com/v3
tags:
  - name: invoices
security:
  - bearerAuth: []
x-logo: logo.png
paths:
  /invoices:
    x-owner: billing
    get:
      tags: [invoices]
      operationId: listInvoices
      x-rate-limit: 100
      parameters:
        - name: session
          in: cookie
          schema:
            type: string
        - name: status
          in: query
          example: open
          schema:
            type: string
      callbacks:
        paid:
          '{$request.body#/callback}':
            post:
              responses:
                '200':
                  description: OK
      responses:
        '200':
          description: The invoices
          headers:
            X-Total:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                two:
                  value: [a, b]
            application/xml:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
