@defer (when loggers() && !isLoading()) {
  <div class="table-responsive">
    <p jhiTranslate="logs.nbloggers" [translateValues]="{ total: loggers()?.length }">There are {{ loggers()?.length }} loggers.</p>

    <jhi-search-toolbar [(query)]="filter" placeholder="Filter loggers" inputId="logs-filter" />

    <table class="table table-sm table-striped table-bordered logs-table" aria-label="Logs">
      <colgroup>
        <col class="logs-col-name" />
        <col class="logs-col-level" />
      </colgroup>
      <thead>
        <tr jhiSort [(sortState)]="sortState">
          <th jhiSortBy="name" scope="col" class="logs-col-name"><span jhiTranslate="logs.table.name">Name</span> <fa-icon icon="sort" /></th>
          <th jhiSortBy="level" scope="col" class="logs-col-level"><span jhiTranslate="logs.table.level">Level</span> <fa-icon icon="sort" /></th>
        </tr>
      </thead>

      <tbody>
        @for (logger of filteredAndOrderedLoggers(); track $index) {
          <tr>
            <td>
              <small>{{ logger.name | slice: 0 : 140 }}</small>
            </td>
            <td>
              <div class="d-flex flex-nowrap gap-1">
              <button
                type="button"
                (click)="changeLevel(logger.name, 'TRACE')"
                class="btn btn-fx-log"
                [ngClass]="logger.level === 'TRACE' ? 'btn-primary' : 'btn-fx-log-idle'"
              >
                TRACE
              </button>

              <button
                type="button"
                (click)="changeLevel(logger.name, 'DEBUG')"
                class="btn btn-fx-log"
                [ngClass]="logger.level === 'DEBUG' ? 'btn-success' : 'btn-fx-log-idle'"
              >
                DEBUG
              </button>

              <button
                type="button"
                (click)="changeLevel(logger.name, 'INFO')"
                class="btn btn-fx-log"
                [ngClass]="logger.level === 'INFO' ? 'btn-info' : 'btn-fx-log-idle'"
              >
                INFO
              </button>

              <button
                type="button"
                (click)="changeLevel(logger.name, 'WARN')"
                class="btn btn-fx-log"
                [ngClass]="logger.level === 'WARN' ? 'btn-warning' : 'btn-fx-log-idle'"
              >
                WARN
              </button>

              <button
                type="button"
                (click)="changeLevel(logger.name, 'ERROR')"
                class="btn btn-fx-log"
                [ngClass]="logger.level === 'ERROR' ? 'btn-danger' : 'btn-fx-log-idle'"
              >
                ERROR
              </button>

              <button
                type="button"
                (click)="changeLevel(logger.name, 'OFF')"
                class="btn btn-fx-log"
                [ngClass]="logger.level === 'OFF' ? 'btn-secondary' : 'btn-fx-log-idle'"
              >
                OFF
              </button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
} @loading {
  <div class="d-flex justify-content-center me-3">
    <div class="spinner-border"></div>
  </div>
}
