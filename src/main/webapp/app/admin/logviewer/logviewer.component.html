<form name="logsForm" #logsForm="ngForm" class="logviewer-toolbar">
  <jhi-search-toolbar
    [(query)]="searchText"
    (queryChange)="onFilterChange()"
    placeholder="Filter log"
    inputId="searchTextId"
  >
    <!-- One node in the @if, without whitespace around it (preserveWhitespaces), so it is projected into [extras] -->
    @if (flowId) {<span extras class="badge text-bg-light border fw-normal d-inline-flex align-items-center gap-1 logviewer-flow">
        <fa-icon icon="file-alt" /> Flow: {{ flowName || flowId }}
        <button type="button" class="logviewer-flow__clear" aria-label="Show the whole log" title="Show the whole log" (click)="showAll()">
          <fa-icon icon="times" />
        </button>
      </span>}
    <div
      extras
      class="input-group"
      style="max-width: 12rem"
      data-toggle="tooltip"
      [title]="
        flowId
          ? 'The number of entries returned (default=250, max=10000). Only the last entries of this Flow are shown.'
          : 'The number of lines returned (default=250, max=10000). Only the last lines of the log file are shown (tail).'
      "
    >
      <span class="input-group-text">{{ flowId ? 'Entries:' : 'Lines:' }}</span>
      <input
        type="number"
        name="lines"
        class="form-control"
        [jhiLogViewerLineValidation]="lines"
        [(ngModel)]="lines"
        id="lines"
        min="1"
        max="10000"
        required
      />
    </div>
    <button
      actions
      type="button"
      (click)="getLogs()"
      [disabled]="logsForm.form.invalid"
      class="btn btn-fx btn-fx-secondary"
      aria-label="Refresh"
    >
      <fa-icon icon="sync"></fa-icon>
      <span>Refresh</span>
    </button>
  </jhi-search-toolbar>
</form>

<pre #logArea class="logviewer-output" [innerHTML]="coloredLog"></pre>
