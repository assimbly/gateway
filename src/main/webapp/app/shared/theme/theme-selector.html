<div class="theme-selector" [class.theme-selector--compact]="compact()" role="radiogroup" aria-label="Color theme" data-cy="themeSelector">
  @for (option of options; track option.value) {
  <button
    type="button"
    role="radio"
    class="theme-selector__option"
    [class.theme-selector__option--selected]="themeService.preference() === option.value"
    [attr.aria-checked]="themeService.preference() === option.value"
    [attr.aria-label]="option.label"
    [attr.data-cy]="'theme-' + option.value"
    (click)="select(option.value)"
  >
    <fa-icon [icon]="option.icon" [fixedWidth]="true" />
    @if (!compact()) {
    <span>{{ option.label }}</span>
    }
  </button>
  }
</div>
