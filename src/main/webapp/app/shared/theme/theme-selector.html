<div
  class="theme-selector"
  [class.theme-selector--compact]="compact()"
  role="radiogroup"
  [attr.aria-label]="'theme.selector.label' | translate"
  data-cy="themeSelector"
>
  @for (option of options; track option.value) {
    <button
      type="button"
      role="radio"
      class="theme-selector__option"
      [class.theme-selector__option--selected]="themeService.preference() === option.value"
      [attr.aria-checked]="themeService.preference() === option.value"
      [attr.aria-label]="option.labelKey | translate"
      [attr.data-cy]="'theme-' + option.value"
      (click)="select(option.value)"
    >
      <fa-icon [icon]="option.icon" [fixedWidth]="true" />
      @if (!compact()) {
        <span [jhiTranslate]="option.labelKey">{{ option.labelKey }}</span>
      }
    </button>
  }
</div>
