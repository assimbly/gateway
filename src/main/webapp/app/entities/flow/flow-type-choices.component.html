<div class="flow-type-choices">
  @for (choice of flowTypes; track choice.title) {
    <a class="flow-type-choice" [routerLink]="choice.link" [queryParams]="choice.queryParams" (click)="chosen.emit()">
      <fa-icon class="flow-type-choice__icon" [icon]="choice.icon" [fixedWidth]="true" />
      <span class="flow-type-choice__text">
        <span class="flow-type-choice__title">{{ choice.title }}</span>
        <span class="flow-type-choice__level">{{ choice.level }}</span>
        <span class="flow-type-choice__audience">{{ choice.audience }}</span>
      </span>
    </a>
  }
</div>

<section class="flow-examples" aria-labelledby="flow-examples-heading">
  <h2 class="flow-examples__heading" id="flow-examples-heading">Or start from an example</h2>
  <div class="flow-examples__list">
    @for (example of examples; track example.id) {
      <a class="flow-example" routerLink="/flow/editor" [queryParams]="{ mode: 'edit', editor: 'flow', template: example.id }"
         (click)="chosen.emit()">
        <span class="flow-example__title">{{ example.title }}</span>
        <span class="flow-example__description">{{ example.description }}</span>
      </a>
    }
  </div>
</section>
