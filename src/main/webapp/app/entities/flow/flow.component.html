<div>
  <jhi-search-toolbar [(query)]="searchText" placeholder="Filter by flow name" inputId="searchTextId">
    <ng-container actions>
      <div ngbDropdown class="d-inline-block" placement="bottom-end">
        <button type="button" class="btn btn-fx btn-fx-primary" id="dropdownMenuFlows" ngbDropdownToggle aria-label="Add">
          <fa-icon icon="plus"></fa-icon>
          <span class="d-none d-md-inline"> Add</span>
        </button>
        <div ngbDropdownMenu aria-labelledby="dropdownMenuFlows">
          <a ngbDropdownItem routerLink="/flow/editor" [queryParams]="{ mode: 'edit', editor: 'flow' }">Flow</a>
          <a ngbDropdownItem routerLink="/flow/editor" [queryParams]="{ mode: 'edit', editor: 'route' }">Route</a>
          <a ngbDropdownItem routerLink="/flow/editor" [queryParams]="{ mode: 'edit', editor: 'script' }">Script</a>
        </div>
      </div>
      <button class="btn btn-fx btn-fx-secondary" type="button" (click)="reset()" aria-label="Refresh">
        <fa-icon icon="sync"></fa-icon>
        <span class="d-none d-md-inline"> Refresh</span>
      </button>
    </ng-container>
  </jhi-search-toolbar>

  <jhi-data-table
    [columns]="columns"
    [(sortState)]="sortState"
    [hasRows]="!!filteredFlows.length"
    [loading]="flowsLoading"
    [emptyMessage]="'No flows yet. Use Add to create a Flow, Route, or Script.'"
    ariaLabel="Flows"
  >
    <tr
      jhi-flow-row
      *ngFor="let flow of filteredFlows; trackBy: trackId"
      [flow]="flow"
    ></tr>
  </jhi-data-table>
</div>
