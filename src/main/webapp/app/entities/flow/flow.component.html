<div>
  @if (hasFlows) {
  <jhi-search-toolbar [(query)]="searchText" placeholder="Filter by flow name" inputId="searchTextId">
    <ng-container actions>
      <button type="button" class="btn btn-fx btn-fx-primary" (click)="openNewFlow()" aria-label="Add">
        <fa-icon icon="plus"></fa-icon>
        <span class="d-none d-md-inline"> Add</span>
      </button>
      <a class="btn btn-fx btn-fx-secondary" routerLink="/import" aria-label="Import">
        <fa-icon icon="file-import"></fa-icon>
        <span class="d-none d-md-inline"> Import</span>
      </a>
      <button class="btn btn-fx btn-fx-secondary" type="button" (click)="reset()" aria-label="Refresh">
        <fa-icon icon="sync"></fa-icon>
        <span class="d-none d-md-inline"> Refresh</span>
      </button>
    </ng-container>
  </jhi-search-toolbar>
  }

  @if (showEmptyState) {
    <section class="flows-empty" aria-labelledby="flows-empty-title">
      <h2 class="flows-empty__title" id="flows-empty-title">Create your first Flow</h2>
      <p class="flows-empty__lead">How do you want to build it?</p>
      <jhi-flow-type-choices />
      <p class="flows-empty__import">
        Or <a class="flows-empty__import-link" routerLink="/import">import</a> a Flow, Camel XML, a script or an OpenAPI document.
      </p>
    </section>
  } @else {
    <jhi-data-table
      [columns]="columns"
      [(sortState)]="sortState"
      [hasRows]="!!filteredFlows.length"
      [loading]="flowsLoading"
      [emptyMessage]="'No flows match this filter.'"
      ariaLabel="Flows"
    >
      <tr
        jhi-flow-row
        *ngFor="let flow of filteredFlows; trackBy: trackId"
        [flow]="flow"
        [handler]="handlers[flow.id!]"
      ></tr>
    </jhi-data-table>
  }
</div>
