<div>
  @if (hasFlows) {
  <jhi-search-toolbar
    [(query)]="searchText"
    placeholder="Filter by flow name"
    inputId="searchTextId"
    hint="A Flow receives messages from a Source, processes them in Steps and delivers them to a Sink."
  >
    <ng-container actions>
      <button type="button" class="btn btn-fx btn-fx-primary" (click)="openNewFlow()" aria-label="Add">
        <fa-icon icon="plus"></fa-icon>
        <span class="d-none d-md-inline"> Add</span>
      </button>
      <button type="button" class="btn btn-fx btn-fx-secondary" (click)="openImport()" aria-label="Import">
        <fa-icon icon="file-import"></fa-icon>
        <span class="d-none d-md-inline"> Import</span>
      </button>
      <button
        type="button"
        class="btn btn-fx btn-fx-secondary"
        (click)="openFluxygenExport()"
        [disabled]="!integrationId || !flows.length"
        aria-label="Export for Fluxygen"
        title="Export the Flows as a zip to import into Fluxygen"
      >
        <fa-icon icon="file-export"></fa-icon>
        <span class="d-none d-md-inline"> Export for Fluxygen</span>
      </button>
      <button class="btn btn-fx btn-fx-secondary" type="button" (click)="reset()" aria-label="Refresh">
        <fa-icon icon="sync"></fa-icon>
        <span class="d-none d-md-inline"> Refresh</span>
      </button>
    </ng-container>
  </jhi-search-toolbar>
  }

  @if (showEmptyState) {
    <jhi-empty-state
      heading="Create your first Flow"
      description="A Flow receives messages from a Source, processes them in Steps and delivers them to a Sink. How do you want to build it?"
      [docs]="true"
    >
      <jhi-flow-type-choices />
      <span secondary>
        Or <button type="button" class="btn btn-link empty-state__link" (click)="openImport()">import</button> a Flow, Camel XML, a script or an OpenAPI document.
      </span>
    </jhi-empty-state>
  } @else {
    <jhi-data-table
      [columns]="columns"
      [(sortState)]="sortState"
      [hasRows]="!!filteredFlows.length"
      [loading]="flowsLoading"
      emptyMessage="No flows match this filter."
      ariaLabel="Flows"
    >
      <tr
        jhi-flow-row
        *ngFor="let flow of filteredFlows; trackBy: trackId"
        [flow]="flow"
        [handler]="handlers[flow.id!]"
        (runtimeChange)="onRuntimeChange(flow.id!, $event)"
      ></tr>
    </jhi-data-table>
  }
</div>
