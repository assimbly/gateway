<ng-template #testConnectionModal>
  <div class="modal-header">
    <h4 class="modal-title">Test Connection</h4>
    <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close" (click)="cancelModal()"></button>
  </div>
  <div class="modal-body" [formGroup]="testConnectionForm">
    <div class="form-group row">
      <div class="col-8">
        <label class="form-control-label" for="field_host">Host name</label>
        <i triggers="mouseenter:mouseleave" popoverTitle="Info"
           [popover]="hostnamePopover" container="body" placement="right"
        >
          <fa-icon icon="info-circle"></fa-icon>
        </i> <input type="text"
                    class="form-control" formControlName="connectionHost"
                    id="connectionHost" required/>
      </div>
      <div class="col-3">
        <label class="form-control-label" for="example-number-input">Port</label>
        <i triggers="mouseenter:mouseleave" popoverTitle="Info"
           [popover]="portPopover" container="body" placement="right"
        >
          <fa-icon icon="info-circle"></fa-icon>
        </i> <input type="number"
                    class="form-control" min="1" max="65535"
                    formControlName="connectionPort" id="connectionPort"/>
      </div>
      <div class="col-1"></div>
    </div>
    <div class="form-group row">
      <div class="col-8">
        <label class="form-control-label" for="example-number-input">Timeout</label>
        <i triggers="mouseenter:mouseleave" popoverTitle="Info"
           [popover]="timeoutPopover" container="body" placement="right"
        >
          <fa-icon icon="info-circle"></fa-icon>
        </i> <input type="number"
                    class="form-control" formControlName="connectionTimeout"
                    id="connectionTimeout"/>
      </div>
      <div class="col-4"></div>
    </div>
    <div [innerHtml]="testConnectionMessage"></div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-fx btn-fx-secondary" (click)="cancelModal()">Close</button>
    <button type="button" class="btn btn-fx btn-fx-primary" (click)="testConnection()">Test</button>
  </div>
</ng-template>

<div class="row">
  <div class="col-12"></div>
</div>

<div class="container">

  <div class="row">

    <form [formGroup]="editFlowForm" class="form-fx-validate" [class.form-submitted]="formSubmitted" (ngSubmit)="save()" *ngIf="finished" novalidate jhiFieldTab>
      <jhi-alert-error></jhi-alert-error>
      <div class="form-group" [style.display]="'none'">
        <label for="id">ID</label>
        <input type="text" class="form-control" id="id" *ngIf="flow" readonly formControlName="id"/>
      </div>

      <div class="form-group">
        <div class="form-group row">
          <div class="col-8">
            <input
              style="border: 2px solid lightgrey; border-radius: 4px;font-weight:bold; font-size: 24px; margin-bottom: 0; min-width: 866px;"
              type="text" class="form-control" id="name" #flowNameInput placeholder="Type flowname..." *ngIf="flow"
              formControlName="name"/>
            <div
              *ngIf="formSubmitted && editFlowForm['controls'].name.errors">
              <div *ngIf="editFlowForm['controls'].name.errors.required" class="invalid-field-message"
                   style="color: red;">*Flowname is required.
              </div>
            </div>
          </div>
          <div class="col-4"></div>
        </div>
      </div>

      <div class="card text-center" style="width: 54rem; background-color: var(--app-hover);">
        <div class="card-header">
          <br/>
          <ul ngbNav #nav="ngbNav" class="nav-pills" [(activeId)]="active2" orientation="horizontal">
            <li ngbNavItem="STEPS" formArrayName="stepsData" novalidate
                [ngStyle]="{'text-align': 'left' }">
              <a ngbNavLink>STEPS</a>
              <ng-template ngbNavContent>
                <br/>
                <hr/>
                <div style="min-height: 44rem;">
                  <jhi-flow-editor-step
                    *ngFor="let step of steps; index as index"
                    [step]="step"
                    [index]="index"
                    [stepForm]="stepFormAt(index)"
                    [activeEditor]="activeEditor"
                    [formSubmitted]="formSubmitted"
                    [sourceComponentsNames]="sourceComponentsNames"
                    [sinkComponentsNames]="sinkComponentsNames"
                    [actionComponentsNames]="actionComponentsNames"
                    [languageComponentsNames]="languageComponentsNames"
                    [routes]="routes"
                    [messages]="messages"
                    [connections]="connections"
                    [routeCreated]="routeCreated"
                    [messageCreated]="messageCreated"
                    [connectionCreated]="connectionCreated"
                    [uriPlaceholder]="uriPlaceholders[index]"
                    [uriPopoverMessage]="uriPopoverMessages[index]"
                    [uriList]="URIList[index]"
                    [componentOptions]="componentOptions[index]"
                    [stepOptions]="stepsOptions[index]"
                    [selectedOptions]="selectedOptions[index]"
                    [componentTypeCamelLink]="componentTypeCamelLinks[index]"
                    [enableMessage]="enableMessage[index]"
                    [enableConnection]="enableConnection[index]"
                    [filterConnection]="filterConnection[index]"
                    [connectionType]="connectionType[index]"
                    [errorHandlerPopoverMessage]="errorHandlerPopoverMessage"
                    [optionsPopoverMessage]="optionsPopoverMessage"
                    [customOptions]="customOptions"
                    (removeStep)="removeStep($event.step, $event.index)"
                    (addStep)="addStep($event.step, $event.index)"
                    (addConnection)="addConnection($event.step, $event.index)"
                    (componentTypeChange)="setTypeLinks($event.step, $event.index, $event.componentType)"
                    (createOrEditRoute)="createOrEditRoute($event.step, $event.control)"
                    (createOrEditMessage)="createOrEditMessage($event.step, $event.control)"
                    (createOrEditConnection)="createOrEditConnection($event.step, $event.connectionType, $event.control)"
                  ></jhi-flow-editor-step>
                </div>
              </ng-template>
            </li>

            <li ngbNavItem="NOTES" novalidate [ngStyle]="{'text-align': 'left' }">
              <a ngbNavLink>NOTES</a>
              <ng-template ngbNavContent>
                <ng-template #notesPopover let-message="message">
                  <div [innerHtml]="notesPopoverMessage"></div>
                </ng-template>
                <br/>
                <hr/>
                <div class="container col-lg-12"
                     style="min-height: 44rem; padding-left: 20px; padding-right: 20px; padding-top: 20px;">
                  <div class="form-group">
                    <ngx-codemirror
                      *ngIf="flow"
                      class="notes-codemirror"
                      id="field_notes"
                      formControlName="notes"
                      [options]="notesEditorOptions()"
                      (codeMirrorLoaded)="refreshCodeMirror($event)">
                    </ngx-codemirror>
                  </div>
                </div>
              </ng-template>
            </li>

          </ul>
          <div [ngbNavOutlet]="nav" class="ml-4"></div>
        </div>
      </div>

      <div class="form-fx-actions" style="max-width: 54rem;">
        <button type="button" class="btn btn-fx btn-fx-secondary" [routerLink]="['/']">
          <fa-icon icon="ban"></fa-icon>
          <span>Cancel</span>
        </button>
        <button type="button" class="btn btn-fx btn-fx-primary" (click)="save()" [disabled]="isSaving || (formSubmitted && editFlowForm.invalid)">
          <fa-icon icon="save"></fa-icon>
          <span>Save</span>
        </button>
      </div>
      <br/>
      <div *ngIf="savingFlowSuccess">
        <span class="text-success">*{{savingFlowSuccessMessage}}</span>
      </div>
      <div *ngIf="savingFlowFailed">
        <span class="text-danger">*{{savingFlowFailedMessage}}</span>
      </div>
      <div *ngIf="!!invalidUriMessage">
        <span class="text-danger">*{{invalidUriMessage}}</span>
      </div>
      <div *ngIf="!!notUniqueUriMessage">
        <span class="text-danger">*{{notUniqueUriMessage}}</span>
      </div>
      <br/>
    </form>
  </div>
</div>
