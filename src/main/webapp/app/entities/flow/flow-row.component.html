<td class="table-fx-identity">
  <div class="d-flex align-items-center gap-2 min-w-0">
    <a class="flex-grow-1 min-w-0" [routerLink]="['/flow/editor', flow.id]"
       [queryParams]="{ mode: 'edit', editor: flow.type || 'flow', id: flow.id }">
      <jhi-truncate [text]="flow.name" />
    </a>
    <jhi-flow-row-alerts
      [flowName]="flow.name"
      [flowError]="flowError"
      [flowErrorButton]="flowErrorButton"
      [numberOfAlerts]="numberOfAlerts"
      (alertsOpen)="openAlerts()"
    />
  </div>
</td>
<td class="text-muted">{{ typeLabel }}</td>
<td>
  @if (state.draft) {
    <span class="d-inline-flex align-items-center gap-1 text-nowrap">
      <jhi-flow-status-pill label="Draft" />
      <span aria-hidden="true">·</span>
      <a [routerLink]="['/flow/editor', flow.id]" [queryParams]="{ mode: 'edit', editor: flow.type || 'flow', id: flow.id }">Finish design</a>
    </span>
  } @else {
    <jhi-flow-status-pill [label]="state.label" [tone]="state.tone" />
  }
</td>
<td class="text-end table-fx-numeric">{{ count(completedCount) }}</td>
<td class="text-end table-fx-numeric">{{ count(failedCount) }}</td>
<td class="text-end">
  <jhi-row-actions>
    <jhi-status-controls
      *ngIf="state.mainAction as action"
      jhiPrimaryAction
      [busy]="disableActionBtns"
      [showStart]="action === 'start'"
      [showStop]="action === 'stop'"
      [showResume]="action === 'resume'"
      (start)="run('start')"
      (stop)="run('stop')"
      (resume)="run('resume')"
    />
    <jhi-flow-row-stats
      jhiPrimaryAction
      [loading]="flowStatsLoading"
      [empty]="flowStatsEmpty"
      [sections]="flowStatsSections"
      (load)="getFlowStatistic(flow)"
    />
    <button
      *ngFor="let action of state.menuActions"
      jhiOverflowAction
      type="button"
      ngbDropdownItem
      class="btn-fx-dropdown-item"
      [disabled]="disableActionBtns"
      (click)="run(action)"
    >
      <fa-icon [icon]="menuIcons[action]"></fa-icon>
      <span>{{ menuLabels[action] }}</span>
    </button>
    <button
      jhiOverflowAction
      type="button"
      ngbDropdownItem
      class="btn-fx-dropdown-item"
      [disabled]="testMessageBlocked !== null"
      [title]="testMessageBlocked ?? ''"
      (click)="sendTestMessage()"
    >
      <fa-icon icon="paper-plane"></fa-icon>
      <span>Send test message</span>
    </button>
    <button jhiOverflowAction type="button" ngbDropdownItem class="btn-fx-dropdown-item" (click)="navigateToFlowEditor('edit')">
      <fa-icon icon="edit"></fa-icon>
      <span>Edit</span>
    </button>
    <button jhiOverflowAction type="button" ngbDropdownItem class="btn-fx-dropdown-item" (click)="navigateToFlowEditor('clone')">
      <fa-icon icon="clone"></fa-icon>
      <span>Clone</span>
    </button>
    <button jhiOverflowAction type="button" ngbDropdownItem class="btn-fx-dropdown-item" (click)="exportFlow()">
      <fa-icon icon="file-export"></fa-icon>
      <span>Export</span>
    </button>
    <button
      jhiOverflowAction
      type="button"
      ngbDropdownItem
      class="btn-fx-dropdown-item btn-fx-dropdown-danger"
      (click)="navigateToFlowEditor('delete')"
    >
      <fa-icon icon="trash"></fa-icon>
      <span>Delete</span>
    </button>
  </jhi-row-actions>
</td>
