<td class="table-fx-identity">
  <div class="d-flex align-items-center gap-2 min-w-0">
    <jhi-truncate class="flex-grow-1" [text]="flow.name" />
    <jhi-flow-row-alerts
      [flowName]="flow.name"
      [flowError]="flowError"
      [flowErrorButton]="flowErrorButton"
      [numberOfAlerts]="numberOfAlerts"
      [alertsLoading]="alertsLoading"
      [alertsLoadingMore]="alertsLoadingMore"
      [alertMessages]="alertMessages"
      (alertsOpen)="onAlertsOpen()"
      (alertsScroll)="onAlertsScroll($event)"
    />
  </div>
</td>
<td class="text-end table-fx-numeric">{{ formatMetric(completedCount) }}</td>
<td class="text-end table-fx-numeric">{{ formatMetric(failedCount) }}</td>
<td class="text-end">
  <jhi-row-actions>
    <button
      jhiPrimaryAction
      type="button"
      class="btn btn-fx btn-fx-sm btn-fx-ghost"
      (click)="navigateToFlowEditor('edit')"
      aria-label="Edit"
    >
      <fa-icon icon="edit"></fa-icon>
      <span class="d-none d-md-inline">Edit</span>
    </button>
    <jhi-flow-row-stats
      jhiPrimaryAction
      [loading]="flowStatsLoading"
      [empty]="flowStatsEmpty"
      [sections]="flowStatsSections"
      (load)="getFlowStatistic(flow)"
    />
    <button jhiOverflowAction type="button" ngbDropdownItem class="btn-fx-dropdown-item" (click)="navigateToFlowEditor('clone')">
      <fa-icon icon="clone"></fa-icon>
      <span>Clone</span>
    </button>
    <button jhiOverflowAction type="button" ngbDropdownItem class="btn-fx-dropdown-item" (click)="exportFlow()">
      <fa-icon icon="file-export"></fa-icon>
      <span>Export</span>
    </button>
    <button
      jhiOverflowAction
      type="button"
      ngbDropdownItem
      class="btn-fx-dropdown-item btn-fx-dropdown-danger"
      (click)="navigateToFlowEditor('delete')"
    >
      <fa-icon icon="trash"></fa-icon>
      <span>Delete</span>
    </button>
  </jhi-row-actions>
</td>
<td class="text-end">
  <jhi-status-controls
    [busy]="disableActionBtns"
    [tone]="statusTone"
    [showStart]="!isFlowStarted"
    [startDisabled]="isDraft"
    [showPause]="!isFlowPaused"
    [pauseDisabled]="isFlowStopped"
    [showResume]="!isFlowResumed"
    [showStop]="true"
    [stopDisabled]="isFlowStopped"
    [showRestart]="isFlowStarted"
    (start)="start()"
    (pause)="pause()"
    (resume)="resume()"
    (stop)="stop()"
    (restart)="restart()"
  />
</td>
