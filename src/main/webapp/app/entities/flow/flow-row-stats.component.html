<ng-template #statsTemplate>
  <jhi-flow-stats-sections [loading]="loading" [empty]="empty" [sections]="sections" />
  @if (detailsLink && !loading && !empty) {
    <a class="flow-stats-details" [routerLink]="detailsLink">Show details <fa-icon icon="arrow-right"></fa-icon></a>
  }
</ng-template>

<button
  type="button"
  class="btn btn-fx btn-fx-sm btn-fx-icon btn-fx-ghost"
  (mouseenter)="load.emit()"
  [ngbPopover]="statsTemplate"
  popoverTitle="Flow stats"
  popoverClass="flow-stats-popover"
  placement="left"
  container="body"
  triggers="click"
  [autoClose]="'outside'"
  aria-label="Stats"
  title="Stats"
>
  <fa-icon icon="chart-bar"></fa-icon>
</button>
