<div class="modal-header">
  <h4 class="modal-title" id="new-flow-title">New Flow</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  <p class="text-muted">How do you want to build it?</p>
  <jhi-flow-type-choices [withImport]="true" (chosen)="activeModal.close()" (importChosen)="chooseFile()" />
  <input
    #fileInput
    type="file"
    class="visually-hidden"
    accept=".xml,application/xml,text/xml"
    tabindex="-1"
    aria-hidden="true"
    (change)="onFileChosen($event)"
  />

  @if (importing(); as fileName) {
    <p class="mt-3 mb-0" role="status"><fa-icon icon="spinner" animation="spin" /> Importing {{ fileName }}…</p>
  }
  @if (importError(); as error) {
    <div class="alert alert-danger mt-3 mb-0" role="alert">{{ error }}</div>
  }
</div>
