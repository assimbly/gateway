<form name="importForm">
    <div class="modal-header">
        <h4 class="modal-title" id="myGatewayLabel">Import server identity (PKCS12)</h4>
        <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close" (click)="clear()"></button>
    </div>
    <div class="modal-body">
    	<div class="alert alert-danger" *ngIf="uploadError">
            <strong>Import error!</strong> {{uploadErrorMessage}}
        </div>
        <p class="text-muted">
            A .p12 or .pfx file with the private key and certificate chain of the server. It is stored in {{identityStore}}.
        </p>
        <div class="form-group" style="margin-top: 8px;">
            <label for="password" class="form-control-label font-weight-bold" style="margin-bottom: 4px;">Password</label>
            <input type="password" id="password" name="password" [(ngModel)]="password" class="form-control" placeholder="Password of the .p12 file">
            <label class="form-control-label font-weight-bold" style="margin-top: 8px;">Certificate File</label>
            <div class="custom-file">
                <input type="file" id="file" class="custom-file-input" accept=".p12,.pfx" (change)='openFile($event)'>
            </div>
            <label for="name" class="form-control-label font-weight-bold" style="margin-top: 8px;">Name</label>
            <input type="text" id="name" name="name" class="form-control" [(ngModel)]="name" #nameField="ngModel" required [pattern]="namePattern" placeholder="Example: my-server">
            <small class="form-text text-muted">Lowercase letters, digits, '.', '_' and '-'.</small>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="clear()">
            <span class="fa fa-ban"></span>&nbsp;
            <span>Cancel</span>
        </button>
        <button type="button" class="btn btn-primary" [disabled]="!certificateFile || nameField.invalid || isSaving" (click)="importIdentity()">
            <span class="fa fa-upload"></span>&nbsp;
            <span>Import</span>
        </button>
    </div>
</form>
