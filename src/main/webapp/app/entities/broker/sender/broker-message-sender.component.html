<div class="send-page">
  <jhi-send-toolbar
    title="Send message"
    [subtitle]="subtitle"
    [showBack]="openedFromEndpoint"
    [sending]="state.sending()"
    (send)="send()"
    (back)="goBack()"
    (fileSelected)="onFile($event)"
  />

  <jhi-send-result [result]="state.result()" />

  @if (finished) {
    <form [formGroup]="messageSenderForm" novalidate>
      <section class="send-card">
        <h2 class="send-card__title">Destination</h2>
        <div class="send-fields">
          <div>
            <label class="form-control-label d-block">Type</label>
            <div class="btn-group" role="group" aria-label="Endpoint type">
              <button
                type="button"
                class="btn btn-fx btn-fx-secondary"
                id="endpointTypeQueue"
                [class.active]="selectedEndpointType === 'queue'"
                [attr.aria-pressed]="selectedEndpointType === 'queue'"
                (click)="setEndpointType('queue')"
              >
                Queue
              </button>
              <button
                type="button"
                class="btn btn-fx btn-fx-secondary"
                id="endpointTypeTopic"
                [class.active]="selectedEndpointType === 'topic'"
                [attr.aria-pressed]="selectedEndpointType === 'topic'"
                (click)="setEndpointType('topic')"
              >
                Topic
              </button>
            </div>
          </div>
          <div>
            <label class="form-control-label d-block" for="destination">Name of the endpoint</label>
            <ng-select
              inputId="destination"
              formControlName="destination"
              [items]="endpointOptions"
              [clearable]="false"
              [addTag]="true"
              addTagText="Send to new endpoint"
              [loading]="loadingSuggestions"
              [notFoundText]="'No existing ' + selectedEndpointType + 's found. Type a name to use it.'"
              [placeholder]="'Select a ' + selectedEndpointType + ' or type a name'"
              aria-label="Name of the endpoint"
              [class.is-invalid]="messageSenderForm.controls.destination.invalid && messageSenderForm.controls.destination.touched"
            ></ng-select>
            @if (messageSenderForm.controls.destination.touched && messageSenderForm.controls.destination.invalid) {
              <div class="invalid-field-message">*Name of the endpoint is required. Please select or type one.</div>
            }
          </div>
        </div>
      </section>
    </form>

    <section class="send-card">
      <h2 class="send-card__title">Message</h2>
      <jhi-send-message-editor [(body)]="body" [(headers)]="headers" [(bodyMode)]="bodyMode" [suggestions]="jmsHeaderNames" />
    </section>
  }
</div>
