<div>
  <ng-template #statsTemplate>
    <div [innerHtml]="brokerInfo"></div>
  </ng-template>
  <ng-template #infoModal>
    <div class="modal-header">
      <h4 class="modal-title">Broker info</h4>
      <button type="button" class="btn-close" aria-label="Close" (click)="cancelModal()"></button>
    </div>
    <div class="modal-body">
      <div [innerHtml]="brokerDetails"></div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-fx btn-fx-secondary" (click)="cancelModal()">Close</button>
    </div>
  </ng-template>

  @if (showEmptyState) {
    <jhi-empty-state
      heading="Add your first Broker"
      description="A Broker is the message server behind your Queues and Topics. Flows and the Send page exchange messages through it."
      [docs]="true"
    >
      <a primary id="jh-create-entity" class="btn btn-fx btn-fx-primary jh-create-entity create-broker" [routerLink]="['/broker/new']">
        <fa-icon icon="plus"></fa-icon>
        <span> Add</span>
      </a>
    </jhi-empty-state>
  } @else {
  <jhi-search-toolbar
    [(query)]="searchText"
    placeholder="Filter by broker name"
    persistKey="searchBrokerText"
    inputId="searchBrokerId"
    hint="A Broker is the message server behind your Queues and Topics. Flows and the Send page exchange messages through it."
  >
    <ng-container actions>
      <button class="btn btn-fx btn-fx-secondary" type="button" (click)="loadAll()" aria-label="Refresh">
        <fa-icon icon="sync"></fa-icon>
        <span class="d-none d-md-inline"> Refresh</span>
      </button>
    </ng-container>
  </jhi-search-toolbar>

  <jhi-data-table
    [columns]="columns"
    [(sortState)]="sortState"
    [hasRows]="!!filteredBrokers.length"
    [loading]="brokersLoading"
    [emptyMessage]="'No broker matches this filter.'"
    ariaLabel="Brokers"
  >
    <tr *ngFor="let rowBroker of filteredBrokers; trackBy: trackId">
      <td class="table-fx-identity">
        <a [routerLink]="['/broker', rowBroker.id, 'edit']">
          <jhi-truncate [text]="rowBroker.name" />
        </a>
      </td>
      <td>
        <jhi-status-controls
          [busy]="disableActionBtns"
          [tone]="statusTone"
          [showStart]="!isBrokerStarted"
          [showStop]="true"
          [stopDisabled]="isBrokerStopped"
          [showRestart]="!isBrokerRestarted"
          (start)="start()"
          (stop)="stop()"
          (restart)="restart()"
        />
      </td>
      <td class="text-end table-fx-numeric">{{ formatMetric(totalConsumers) }}</td>
      <td class="text-end table-fx-numeric">{{ formatMetric(totalMessages) }}</td>
      <td>
        @if (isBrokerStarted) {
          <button
            type="button"
            class="btn btn-fx btn-fx-sm btn-fx-icon btn-fx-ghost"
            (click)="getBrokerInfo(rowBroker.id)"
            [ngbPopover]="statsTemplate"
            popoverTitle="Stats"
            placement="left"
            container="body"
            triggers="click"
            [autoClose]="'outside'"
            aria-label="Stats"
            title="Stats"
          >
            <fa-icon icon="chart-bar"></fa-icon>
          </button>
        } @else {
          <span class="text-muted">—</span>
        }
      </td>
      <td class="text-end">
        <jhi-row-actions>
          <a
            jhiPrimaryAction
            class="btn btn-fx btn-fx-sm btn-fx-ghost"
            [routerLink]="['/broker', rowBroker.id, 'edit']"
            aria-label="Edit"
          >
            <fa-icon icon="pencil-alt"></fa-icon>
            <span class="d-none d-md-inline">Edit</span>
          </a>
          <button
            jhiOverflowAction
            type="button"
            ngbDropdownItem
            class="btn-fx-dropdown-item"
            (click)="openInfoModal(infoModal)"
          >
            <fa-icon icon="info"></fa-icon>
            <span>Info</span>
          </button>
          <button
            jhiOverflowAction
            type="button"
            ngbDropdownItem
            class="btn-fx-dropdown-item btn-fx-dropdown-danger"
            (click)="delete(rowBroker)"
          >
            <fa-icon icon="trash"></fa-icon>
            <span>Delete</span>
          </button>
        </jhi-row-actions>
      </td>
    </tr>
  </jhi-data-table>
  }
</div>
