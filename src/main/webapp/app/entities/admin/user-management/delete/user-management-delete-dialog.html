@if (userManagement) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(userManagement.login)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="userManagementDeleteDialogHeading">Delete User</h4>
      <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
    </div>

    <div class="modal-body">
      <jhi-alert-error />
      <p
        id="jhi-delete-userManagement-heading"
        jhiTranslate="userManagement.delete.question"
        [translateValues]="{ login: userManagement.login }"
      >
        Delete User '{{ userManagement.login }}'? This cannot be undone.
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-fx btn-fx-secondary" (click)="cancel()">
        <fa-icon icon="ban" /><span jhiTranslate="entity.action.cancel">Cancel</span>
      </button>

      <button id="jhi-confirm-delete-userManagement" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-fx btn-fx-danger" [disabled]="deleting()">
        <fa-icon icon="trash" /><span jhiTranslate="entity.action.delete">Delete</span>
      </button>
    </div>
  </form>
}
