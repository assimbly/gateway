<form *ngIf="route" name="deleteForm" (submit)="$event.preventDefault()">
    <div class="modal-header">
        <h4 class="modal-title">Delete Route</h4>
        <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close" (click)="cancel()"></button>
    </div>

    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>

        <p id="jhi-delete-route-heading">Delete Route '{{ route.name }}'? This cannot be undone.</p>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-fx btn-fx-secondary" data-dismiss="modal" (click)="cancel()">
            <fa-icon icon="ban"></fa-icon><span>Cancel</span>
        </button>

        <button id="jhi-confirm-delete-route" type="button" (click)="confirmDelete(route.id!)" class="btn btn-fx btn-fx-danger">
            <fa-icon icon="trash"></fa-icon><span>Delete</span>
        </button>
    </div>
</form>
