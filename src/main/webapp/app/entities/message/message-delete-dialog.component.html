<form name="deleteForm" (submit)="$event.preventDefault()">
    <div class="modal-header">
        <h4 class="modal-title">Delete Message</h4>
        <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close" (click)="clear()"></button>
    </div>
    <div class="modal-body">
            <p id="jhi-delete-message-heading" *ngIf="!errorMessage">Delete Message '{{ message.name }}'? This cannot be undone.</p>
        <p id="jhi-delete-message-heading" *ngIf="errorMessage">This Message is used by a Flow, so it cannot be deleted.</p>
        <jhi-alert-error></jhi-alert-error>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-fx btn-fx-secondary" data-dismiss="modal" (click)="clear()">
            <fa-icon [icon]="'ban'"></fa-icon><span>Cancel</span>
        </button>
        <button id="jhi-confirm-delete-message" type="button" (click)="confirmDelete(message.id)" class="btn btn-fx btn-fx-danger" [disabled]="!deleteMode">
            <fa-icon [icon]="'trash'"></fa-icon><span>Delete</span>
        </button>
    </div>
</form>
