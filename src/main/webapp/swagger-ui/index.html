<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>gateway - Swagger UI</title>
    <base href="/swagger-ui/" />
    <link rel="stylesheet" type="text/css" href="./swagger-ui.css" />
    <link rel="icon" type="image/png" href="./favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="./favicon-16x16.png" sizes="16x16" />
  </head>

  <body>
    <div id="swagger-ui"></div>

    <script src="./swagger-ui-bundle.js"></script>
    <script src="./swagger-ui-standalone-preset.js"></script>
    <script src="./axios.min.js"></script>

    <script type="text/javascript">
      const AlwaysEnableTryItOutPlugin = function (system) {
        return {
          components: {
            TryItOutButton: () => null,
          },
        };
      };

      window.onload = async function () {
        const serverBaseUri = document.baseURI.replace('swagger-ui/', '');
        const getBearerToken = () => {
          var authToken = localStorage.getItem('jhi-authenticationToken') || sessionStorage.getItem('jhi-authenticationToken');
          if (authToken) {
            authToken = JSON.parse(authToken);
            return `Bearer ${authToken}`;
          }
          return null;
        };
        const axiosConfig = {
          timeout: 5000,
          baseURL: serverBaseUri,
          headers: { Authorization: getBearerToken() },
        };

        const baseUrl = 'v3/api-docs';
        // Groups of OpenApiGroupsConfiguration, in dropdown order. Unknown groups are added at the end.
        const groupLabels = {
          integration: 'Integration runtime',
          broker: 'Broker runtime',
          configuration: 'Configuration',
          resources: 'Resources',
          observability: 'Observability',
          springdocDefault: 'All endpoints',
          management: 'Management (actuator)',
        };
        const groupOrder = Object.keys(groupLabels);
        const rank = group => (groupOrder.includes(group) ? groupOrder.indexOf(group) : groupOrder.length);
        let urls;

        if (!urls || urls.length === 0) {
          const response = await axios.get('/management/jhiopenapigroups', axiosConfig);
          if (Array.isArray(response.data)) {
            urls = response.data
              .slice()
              .sort((a, b) => rank(a.group) - rank(b.group) || a.description.localeCompare(b.description))
              .map(({ group, description }) => ({ name: groupLabels[group] || description, url: `${serverBaseUri}${baseUrl}/${group}` }));
          } else {
            urls = [{ name: 'default', url: `${serverBaseUri}${baseUrl}` }];
          }
        }
        console.log(`Swagger urls`, urls);

        // Build a system
        var ui = SwaggerUIBundle({
          urls: urls,
          url: baseUrl,
          dom_id: '#swagger-ui',
          deepLinking: true,
          filter: true,
          layout: 'StandaloneLayout',
          withCredentials: true,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          plugins: [SwaggerUIBundle.plugins.DownloadUrl, AlwaysEnableTryItOutPlugin],
          tryItOutEnabled: true,
          requestInterceptor: function (req) {
            req.headers['Authorization'] = getBearerToken();
            // Remove the sample Swagger UI request body if present
            if (req.method === 'GET' && req.body === '{"additionalProp1":"string","additionalProp2":"string","additionalProp3":"string"}') {
              req.body = undefined;
            }
            return req;
          },
        });

        window.ui = ui;
      };
    </script>
  </body>
</html>
